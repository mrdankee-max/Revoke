name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Revoke-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f Revoke-source.zip || { echo 'Revoke-source.zip was not found in the repository root.'; exit 1; }
          mkdir -p source
          unzip -q Revoke-source.zip -d source
          test -f source/Revoke/pubspec.yaml || { echo 'Expected source/Revoke/pubspec.yaml. Check the ZIP folder structure.'; exit 1; }

      - name: Restore rlottie submodule
        run: |
          mkdir -p source/Revoke/third_party
          rm -rf source/Revoke/third_party/rlottie
          git clone --depth 1 https://github.com/Samsung/rlottie.git source/Revoke/third_party/rlottie

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/Revoke/native/komet_crypto/rust

      - name: Install Flutter dependencies
        working-directory: source/Revoke
        run: flutter pub get

      - name: Build universal APK
        working-directory: source/Revoke
        run: flutter build apk --release --flavor komet --obfuscate --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: komet-android-universal
          path: source/Revoke/build/app/outputs/flutter-apk/app-komet-release.apk
          if-no-files-found: error
          retention-days: 30
